<script>
/* util.js — primitives : formats Docker (tailles, durées, tableaux), générateur pseudo-aléatoire, découpage de ligne de commande */
(function (g) {
'use strict';
const NS = g.NS = g.NS || {};
const U = NS.U = {};

/* ---------- aléatoire déterministe (tests reproductibles) ---------- */
U.rng = function (seed) {
  let a = seed >>> 0;
  return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
};
U.hash32 = function (s) { let h = 2166136261 >>> 0; s = String(s); for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; } return h >>> 0; };
U.hexOf = function (seed, n) { const r = U.rng(U.hash32(seed)); let o = ''; while (o.length < n) o += Math.floor(r() * 16).toString(16); return o; };

/* ---------- tailles et durées (même rendu que go-units, utilisé par Docker) ---------- */
U.humanSize = function (b) {
  const u = ['B', 'kB', 'MB', 'GB', 'TB']; let i = 0, v = b;
  while (v >= 1000 && i < u.length - 1) { v /= 1000; i++; }
  return String(Number(v.toPrecision(3))) + u[i];
};
U.humanDuration = function (ms) {
  const s = Math.floor(ms / 1000);
  if (s < 1) return 'Less than a second';
  if (s === 1) return '1 second';
  if (s < 60) return s + ' seconds';
  const m = Math.floor(s / 60);
  if (m === 1) return 'About a minute';
  if (m < 60) return m + ' minutes';
  const h = Math.round(ms / 3600000);
  if (h === 1) return 'About an hour';
  if (h < 48) return h + ' hours';
  if (h < 24 * 7 * 2) return Math.floor(h / 24) + ' days';
  if (h < 24 * 30 * 2) return Math.floor(h / 24 / 7) + ' weeks';
  if (h < 24 * 365 * 2) return Math.floor(h / 24 / 30) + ' months';
  return Math.floor(h / 24 / 365) + ' years';
};

/* ---------- dates ---------- */
const p2 = n => String(n).padStart(2, '0');
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
U.iso = ms => { const d = new Date(ms); return d.getUTCFullYear() + '-' + p2(d.getUTCMonth() + 1) + '-' + p2(d.getUTCDate()) + 'T' + p2(d.getUTCHours()) + ':' + p2(d.getUTCMinutes()) + ':' + p2(d.getUTCSeconds()) + '.' + String(Math.floor(ms % 1000)).padStart(3, '0') + '000000Z'; };
U.isoShort = ms => { const d = new Date(ms); return d.getUTCFullYear() + '-' + p2(d.getUTCMonth() + 1) + '-' + p2(d.getUTCDate()) + ' ' + p2(d.getUTCHours()) + ':' + p2(d.getUTCMinutes()) + ':' + p2(d.getUTCSeconds()) + ' +0000 UTC'; };
U.httpDate = ms => { const d = new Date(ms); return DOW[d.getUTCDay()] + ', ' + p2(d.getUTCDate()) + ' ' + MON[d.getUTCMonth()] + ' ' + d.getUTCFullYear() + ' ' + p2(d.getUTCHours()) + ':' + p2(d.getUTCMinutes()) + ':' + p2(d.getUTCSeconds()) + ' GMT'; };
U.nginxAccess = ms => { const d = new Date(ms); return p2(d.getUTCDate()) + '/' + MON[d.getUTCMonth()] + '/' + d.getUTCFullYear() + ':' + p2(d.getUTCHours()) + ':' + p2(d.getUTCMinutes()) + ':' + p2(d.getUTCSeconds()) + ' +0000'; };
U.nginxError = ms => { const d = new Date(ms); return d.getUTCFullYear() + '/' + p2(d.getUTCMonth() + 1) + '/' + p2(d.getUTCDate()) + ' ' + p2(d.getUTCHours()) + ':' + p2(d.getUTCMinutes()) + ':' + p2(d.getUTCSeconds()); };
U.redisTime = ms => { const d = new Date(ms); return p2(d.getUTCDate()) + ' ' + MON[d.getUTCMonth()] + ' ' + d.getUTCFullYear() + ' ' + p2(d.getUTCHours()) + ':' + p2(d.getUTCMinutes()) + ':' + p2(d.getUTCSeconds()) + '.' + String(Math.floor(ms % 1000)).padStart(3, '0'); };
U.pgTime = ms => { const d = new Date(ms); return d.getUTCFullYear() + '-' + p2(d.getUTCMonth() + 1) + '-' + p2(d.getUTCDate()) + ' ' + p2(d.getUTCHours()) + ':' + p2(d.getUTCMinutes()) + ':' + p2(d.getUTCSeconds()) + '.' + String(Math.floor(ms % 1000)).padStart(3, '0') + ' UTC'; };
U.dateLine = ms => { const d = new Date(ms); return DOW[d.getUTCDay()] + ' ' + MON[d.getUTCMonth()] + ' ' + String(d.getUTCDate()).padStart(2, ' ') + ' ' + p2(d.getUTCHours()) + ':' + p2(d.getUTCMinutes()) + ':' + p2(d.getUTCSeconds()) + ' UTC ' + d.getUTCFullYear(); };
U.apacheTime = ms => { const d = new Date(ms); return DOW[d.getUTCDay()] + ' ' + MON[d.getUTCMonth()] + ' ' + p2(d.getUTCDate()) + ' ' + p2(d.getUTCHours()) + ':' + p2(d.getUTCMinutes()) + ':' + p2(d.getUTCSeconds()) + '.' + String(Math.floor(ms % 1000)).padStart(3, '0') + '000 ' + d.getUTCFullYear(); };

/* ---------- tableaux alignés comme le tabwriter de Docker (minwidth 10, padding 3) ---------- */
U.table = function (rows) {
  if (!rows.length) return '';
  const nc = Math.max.apply(null, rows.map(r => r.length)); const w = [];
  for (let c = 0; c < nc - 1; c++) { let m = 0; rows.forEach(r => { m = Math.max(m, String(r[c] === undefined ? '' : r[c]).length); }); w.push(Math.max(10, m + 3)); }
  return rows.map(r => r.map((x, c) => c < r.length - 1 ? String(x).padEnd(w[c]) : String(x)).join('')).join('\n') + '\n';
};

/* ---------- gabarits Go minimalistes : {{.A.B}}, {{json .A}}, {{.A.B.C}} ---------- */
U.getPath = function (obj, path) {
  let v = obj; const parts = path.replace(/^\./, '').split('.').filter(Boolean);
  for (const p of parts) { if (v === null || v === undefined) return undefined; v = v[p]; }
  return v;
};
U.goTemplate = function (tpl, obj) {
  tpl = String(tpl).replace(/\\t/g, '\t').replace(/\\n/g, '\n');
  const render = (t, o, vars) => {
    t = t.replace(/\{\{\s*range\s+(?:\$(\w+)\s*,\s*\$(\w+)\s*:=\s*)?([^}]+?)\s*\}\}([\s\S]*?)\{\{\s*end\s*\}\}/g, (m, kv, vv, path, body) => {
      const coll = U.getPath(o, path.trim()); if (!coll) return '';
      const entries = Array.isArray(coll) ? coll.map((x, i) => [i, x]) : Object.keys(coll).map(k => [k, coll[k]]);
      return entries.map(([k, v]) => render(body, v, Object.assign({}, vars, kv ? { [kv]: k } : {}, vv ? { [vv]: v } : {}))).join('');
    });
    return t.replace(/\{\{\s*([^}]*?)\s*\}\}/g, (m, e) => {
      let json = false; if (/^json\s+/.test(e)) { json = true; e = e.replace(/^json\s+/, ''); }
      if (/^len\s+/.test(e)) { const v = U.getPath(o, e.replace(/^len\s+/, '')); return String(v ? (Array.isArray(v) ? v.length : Object.keys(v).length) : 0); }
      let v;
      if (e[0] === '$') { const mm = /^\$(\w+)((?:\.\w+)*)$/.exec(e); if (!mm || !(mm[1] in vars)) return ''; v = mm[2] ? U.getPath(vars[mm[1]], mm[2]) : vars[mm[1]]; }
      else if (e === '.') v = o; else v = U.getPath(o, e);
      if (json) return JSON.stringify(v === undefined ? null : v);
      if (v === undefined || v === null) return '<no value>';
      if (typeof v === 'object') return JSON.stringify(v);
      return String(v);
    });
  };
  return render(tpl, obj, {});
};

/* ---------- analyse de ligne de commande (guillemets, $VAR, $(…), |, &&, ||, ;, >, >>) ---------- */
/* renvoie une liste de commandes : { words:[ [{t,m}] ], redir:[{op,target}], sep: ';'|'&&'|'||'|'|'|null } ; m = 'p' (nu) | 's' (simple) | 'd' (double) */
U.parseLine = function (line) {
  const cmds = []; let cur = { words: [], redir: [], sep: null }; let word = null; let i = 0; const n = line.length;
  const pushWord = () => { if (word) { const r = cur.redir[cur.redir.length - 1]; if (r && r.target === null && !r.done) r.target = word; else cur.words.push(word); word = null; } };
  const addTxt = (t, m) => { if (!word) word = []; const last = word[word.length - 1]; if (last && last.m === m) last.t += t; else word.push({ t, m }); };
  const endCmd = sep => { pushWord(); cur.sep = sep; cmds.push(cur); cur = { words: [], redir: [], sep: null }; };
  while (i < n) {
    const ch = line[i];
    if (ch === ' ' || ch === '\t') { pushWord(); i++; continue; }
    if (ch === '#' && !word) break;
    if (ch === "'") { const j = line.indexOf("'", i + 1); if (j < 0) throw new Error("unexpected EOF while looking for matching `''"); if (!word) word = []; addTxt(line.slice(i + 1, j), 's'); i = j + 1; continue; }
    if (ch === '"') {
      let j = i + 1, buf = '';
      while (j < n && line[j] !== '"') {
        if (line[j] === '\\' && j + 1 < n && '"\\$`'.indexOf(line[j + 1]) >= 0) { buf += line[j + 1]; j += 2; continue; }
        if (line[j] === '$' && line[j + 1] === '(') { let d = 1, k = j + 2; while (k < n && d) { if (line[k] === '(') d++; else if (line[k] === ')') d--; k++; } buf += line.slice(j, k); j = k; continue; }
        buf += line[j++];
      }
      if (j >= n) throw new Error("unexpected EOF while looking for matching `\"'");
      if (!word) word = []; addTxt(buf, 'd'); i = j + 1; continue;
    }
    if (ch === '\\' && i + 1 < n) { addTxt(line[i + 1], 's'); i += 2; continue; }
    if (ch === '$' && line[i + 1] === '(') { let d = 1, k = i + 2; while (k < n && d) { if (line[k] === '(') d++; else if (line[k] === ')') d--; k++; } addTxt(line.slice(i, k), 'p'); i = k; continue; }
    if (ch === '|') { if (line[i + 1] === '|') { endCmd('||'); i += 2; } else { endCmd('|'); i++; } continue; }
    if (ch === '&') { if (line[i + 1] === '&') { endCmd('&&'); i += 2; continue; } if (line[i + 1] === '>') { pushWord(); cur.redir.push({ op: '&>', target: null }); i += 2; continue; } addTxt('&', 'p'); i++; continue; }
    if (ch === ';') { endCmd(';'); i++; continue; }
    if (ch === '>' || (ch === '2' && line[i + 1] === '>' && !word)) {
      let fd = 1; if (ch === '2') { fd = 2; i++; }
      pushWord();
      let op = '>'; i++; if (line[i] === '>') { op = '>>'; i++; }
      if (line[i] === '&' && line[i + 1] === '1') { cur.redir.push({ op: fd + '>&1', target: null, done: true }); i += 2; continue; }
      cur.redir.push({ op: fd === 2 ? '2' + op : op, target: null }); continue;
    }
    addTxt(ch, 'p'); i++;
  }
  pushWord();
  if (cur.words.length || cur.redir.length || cmds.length === 0) { cur.sep = null; cmds.push(cur); }
  return cmds;
};

U.shellSplit = function (s) { const c = U.parseLine(s); return c.length && c[0].words.map(w => w.map(x => x.t).join('')); };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* clock.js — horloge simulée à événements discrets (même principe que sim.js du simulateur réseau) */
(function (g) {
'use strict';
const NS = g.NS = g.NS || {};

NS.Clock = class Clock {
  constructor() { this.now = 0; this.q = []; this.seq = 0; }
  /* planifie fn dans `ms` millisecondes simulées ; renvoie un identifiant annulable */
  schedule(ms, fn) { const ev = { t: this.now + Math.max(0, ms), id: ++this.seq, fn, dead: false }; let i = this.q.length; while (i > 0 && (this.q[i - 1].t > ev.t)) i--; this.q.splice(i, 0, ev); return ev; }
  cancel(ev) { if (ev) ev.dead = true; }
  /* exécute les événements échus jusqu'à now+ms */
  runFor(ms) {
    const end = this.now + ms;
    for (;;) {
      while (this.q.length && this.q[0].dead) this.q.shift();
      if (!this.q.length || this.q[0].t > end) break;
      const ev = this.q.shift(); this.now = Math.max(this.now, ev.t);
      try { ev.fn(); } catch (e) { if (this.onError) this.onError(e); else throw e; }
    }
    this.now = Math.max(this.now, end);
  }
  /* avance jusqu'à ce que pred() soit vrai (ou max ms simulées écoulées) */
  runUntil(pred, max) {
    const end = this.now + (max || 60000);
    while (!pred()) {
      while (this.q.length && this.q[0].dead) this.q.shift();
      if (!this.q.length || this.q[0].t > end) { this.now = Math.min(Math.max(this.now, end), end); return pred(); }
      const ev = this.q.shift(); this.now = Math.max(this.now, ev.t);
      try { ev.fn(); } catch (e) { if (this.onError) this.onError(e); else throw e; }
    }
    return true;
  }
  pending() { return this.q.filter(e => !e.dead).length; }
};
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* vfs.js — système de fichiers virtuel (hôte, conteneurs, volumes) avec points de montage */
(function (g) {

const file = (d, m) => ({ t: 'f', d: d === undefined ? '' : String(d), m: m || '-rw-r--r--' });

class VFS {
  constructor(root) { this.root = root || dir(); this.mounts = []; this.home = '/root'; }

  norm(cwd, p) {

    const parts = (p.startsWith('/') ? p : (cwd || '/') + '/' + p).split('/'); const out = [];
    for (const s of parts) { if (!s || s === '.') continue; if (s === '..') out.pop(); else out.push(s); }

    if (!best) return { fs: this, path };
    const rest = path.slice(best.path.length);
    return best.vfs.locate(this._join(best.sub, rest));
  }
  _join(a, b) { const s = (a === '/' ? '' : a) + (b || ''); return s || '/'; }

    let n = this.root; const parts = path.split('/').filter(Boolean);
    for (const p of parts) { if (n.t !== 'd') return null; if (!n.c[p]) { if (!create) return null; n.c[p] = dir(); } n = n.c[p]; }
    return n;
  }
  get(path) { const l = this.locate(path); return l.fs._walk(l.path, false); }
  exists(path) { return !!this.get(path); }
  isDir(path) { const n = this.get(path); return !!n && n.t === 'd'; }
  isFile(path) { const n = this.get(path); return !!n && n.t === 'f'; }
  read(path) { const n = this.get(path); return n && n.t === 'f' ? n.d : null; }
  list(path) {

    const names = Object.keys(n.c);

  id: 'cycle-vie', diff: 1, cat: 'Découverte', level: 'Initiation', duration: '30 min', title: 'Le cycle de vie d\'un conteneur',
  desc: 'Démarrer, observer, arrêter, redémarrer et supprimer des conteneurs. Un ancien site tourne déjà sur le port 8080 : vous devez le remplacer.',
  objectives: ['Citer les états d\'un conteneur (Created, Up, Exited) et les transitions', 'Utiliser run -d, ps, logs, stop, start, rm', 'Comprendre pourquoi un port ou un nom est « déjà utilisé »'],
  parts: [
    P('Les états d\'un conteneur', [
      'Un conteneur passe par plusieurs états : <b>Created</b> (créé, pas démarré) → <b>Up</b> (en cours) → <b>Exited</b> (terminé). On peut le redémarrer (<code>start</code>) autant de fois qu\'on veut ; il garde son identité, sa configuration et ses données. Seul <code>rm</code> le détruit.',
      '<code>docker stop</code> envoie d\'abord le signal <b>SIGTERM</b> (« arrête-toi proprement ») puis, si le processus n\'obéit pas au bout de 10 secondes, <b>SIGKILL</b> (arrêt brutal, code de sortie 137). <code>docker kill</code> envoie directement SIGKILL.'],
    [S('Observez l\'état de départ : <code>docker ps -a</code>.', 'Avant d\'agir sur un système, on regarde toujours ce qui existe déjà.', 'Un conteneur <b>test</b> en cours (Up, port 8080) et un conteneur <b>ancien</b> arrêté (Exited (0)).')]),
    P('Publier un port', [
      'Un conteneur a sa propre pile réseau : un serveur web qui écoute sur son port 80 n\'est <b>pas</b> joignable depuis l\'hôte par défaut. L\'option <code>-p HÔTE:CONTENEUR</code> publie un port : <code>-p 8080:80</code> signifie « ce qui arrive sur le port 8080 de l\'hôte est envoyé au port 80 du conteneur ».',
      'Un port de l\'hôte ne peut être utilisé que par <b>un seul</b> programme à la fois. Si deux conteneurs demandent 8080, le second échoue : c\'est le conflit de port.'],
    [S('Essayez de lancer un nouveau serveur web : <code>docker run -d --name web -p 8080:80 nginx</code>.', 'On veut remplacer l\'ancien site. Mais le port 8080 est déjà pris par « test » : vous allez voir une erreur, et c\'est voulu !', 'Après le téléchargement de nginx, une erreur « Bind for 0.0.0.0:8080 failed: <b>port is already allocated</b> ».', [['-d', '« detached » : le conteneur tourne en arrière-plan et rend la main au terminal'], ['--name web', 'donne un nom lisible (sinon nom aléatoire)'], ['-p 8080:80', 'publie le port 80 du conteneur sur le port 8080 de l\'hôte'], ['nginx', 'l\'image : un serveur web']]),
     S('Regardez ce qu\'est devenu « web » : <code>docker ps -a</code>.', 'Docker a bien <b>créé</b> le conteneur avant d\'échouer à le démarrer : il reste donc dans l\'état Created et occupe le nom « web ».', 'Une ligne <b>web</b> au statut <i>Created</i>, sans ports.')]),
    P('Arrêter, supprimer, recréer', [
      'Pour libérer le port : on arrête « test ». Pour réutiliser le nom « web » : on supprime le conteneur raté. <code>docker rm</code> refuse de supprimer un conteneur qui tourne, sauf avec <code>-f</code> (force : kill puis suppression).'],
    [S('Arrêtez <b>test</b> : <code>docker stop test</code>.', 'Cela libère le port 8080. nginx comprend SIGTERM et s\'arrête immédiatement.', 'Le nom « test » s\'affiche. <code>docker ps</code> ne le montre plus.'),
     S('Supprimez le conteneur raté puis recréez-le : <code>docker rm web</code> puis <code>docker run -d --name web -p 8080:80 nginx</code>.', 'Impossible de réutiliser le nom « web » tant que l\'ancien conteneur existe, même arrêté. Le nom est libéré par la suppression.', 'Cette fois, un long identifiant (64 caractères) : le conteneur tourne.'),
     S('Testez : <code>curl http://localhost:8080</code> puis <code>docker logs web</code>.', 'curl joue le rôle d\'un navigateur : il prouve que la publication de port fonctionne. <code>logs</code> affiche ce que le processus du conteneur a écrit sur sa sortie.', 'Le HTML « Welcome to nginx! » ; dans les journaux, la ligne d\'accès « GET / HTTP/1.1 » 200.')]),
    P('Faire le ménage', [
      'Les conteneurs arrêtés s\'accumulent et occupent de la place : bonne pratique, on supprime ce dont on n\'a plus besoin. <code>docker rm</code> accepte plusieurs noms à la suite.'],
    [S('Supprimez les anciens : <code>docker rm test ancien</code>. Vérifiez avec <code>docker ps -a</code>.', 'Il ne doit rester que le conteneur « web », celui qui sert votre site.', 'Les noms supprimés s\'affichent ; seul <b>web</b> reste, en <i>Up</i>.')]),
  ],
  recap: ['Created → Up → Exited ; start le relance, rm le détruit.', 'stop = SIGTERM puis SIGKILL après 10 s ; kill = SIGKILL tout de suite.', '-p hôte:conteneur publie un port ; un port d\'hôte ne sert qu\'à un seul conteneur.', 'Un nom de conteneur est unique : il faut supprimer l\'ancien pour le réutiliser.'],
  build(lab) { NS.execLines(lab, ['docker run -d --name test -p 8080:80 nginx', 'docker run --name ancien alpine echo "ancienne version"']); },
  solve: solveWith(['docker stop test', 'docker rm web', 'docker run -d --name web -p 8080:80 nginx', 'curl http://localhost:8080', 'docker rm test ancien', 'docker ps -a']),
  checks: [
    { label: 'Le conteneur « web » tourne et publie 8080 → 80', run: c => c.running('web') && c.published('web', 8080, 80) },
    { label: 'http://localhost:8080 répond « Welcome to nginx! »', run: c => c.running('web') && c.http('http://localhost:8080').body.includes('Welcome to nginx!') },
    { label: 'Le conteneur « test » a été supprimé', run: c => !c.exists('test') },
    { label: 'Le conteneur « ancien » a été supprimé', run: c => !c.exists('ancien') },
    { label: 'Il ne reste qu\'un seul conteneur', run: c => c.count('containers') === 1 },
  ],
});

SC.push({
  id: 'nettoyage', diff: 1, cat: 'Découverte', level: 'Initiation', duration: '20 min', title: 'Faire le ménage sur un hôte encombré',
  desc: 'Un hôte Docker de développement déborde : conteneurs arrêtés, volumes oubliés, images inutilisées. Retrouvez de la place sans casser ce qui tourne.',
  objectives: ['Mesurer l\'occupation disque avec docker system df', 'Utiliser les commandes prune', 'Savoir ce qu\'un prune supprime… et ce qu\'il épargne'],
  parts: [
    P('Ce qui consomme de la place', [
      'Docker ne supprime jamais rien tout seul. Trois choses s\'accumulent : les <b>conteneurs arrêtés</b> (leur couche d\'écriture et leurs journaux), les <b>images</b> téléchargées ou construites, et les <b>volumes</b> (données persistantes). Sur une machine de développement, cela finit par représenter des gigaoctets.',
      'Les commandes <code>prune</code> suppriment ce qui est <b>inutilisé</b> : « inutilisé » veut dire qu\'aucun conteneur (en cours ou arrêté) n\'y fait référence. Elles ne touchent donc pas à ce qui sert.'],
    [S('Mesurez l\'occupation : <code>docker system df</code>, puis regardez <code>docker ps -a</code>, <code>docker volume ls</code> et <code>docker images</code>.', 'Avant de supprimer, on mesure et on regarde : un prune est irréversible.', 'Un tableau avec les colonnes TOTAL, ACTIVE, SIZE et RECLAIMABLE (« récupérable »). Un seul conteneur, <b>prod-web</b>, tourne : il ne doit surtout pas être touché.')]),
    P('Nettoyer méthodiquement', [
      '<b>L\'ordre compte</b> : une image ou un volume utilisé par un conteneur arrêté n\'est pas « inutilisé ». On supprime donc d\'abord les conteneurs, puis les volumes, puis les images.',
      'Piège classique : depuis Docker 23, <code>docker volume prune</code> ne supprime que les volumes <b>anonymes</b>. Pour les volumes <b>nommés</b> il faut ajouter <code>-a</code> (« all »), car un volume nommé a été créé volontairement.'],
    [S('Supprimez les conteneurs arrêtés : <code>docker container prune</code> (répondez <code>y</code>).', 'Docker demande confirmation car l\'opération est définitive.', 'Une liste « Deleted Containers » et « Total reclaimed space ». prod-web n\'est pas dans la liste : il tourne.'),
     S('Supprimez les volumes inutilisés : <code>docker volume prune -a</code> (répondez <code>y</code>).', 'Maintenant que les conteneurs arrêtés ont disparu, le volume « vieux-donnees » n\'est plus utilisé par personne. Avec <code>-a</code> les volumes nommés sont inclus ; celui de prod-web est épargné car il sert.', 'Seul « vieux-donnees » est supprimé.', [['-a', 'inclut les volumes nommés (pas seulement les anonymes)']]),
     S('Supprimez les images inutilisées : <code>docker image prune -a</code> (répondez <code>y</code>).', 'Sans <code>-a</code>, seules les images « dangling » (sans nom) partent. Avec <code>-a</code>, toute image qu\'aucun conteneur n\'utilise est supprimée. nginx est conservée car prod-web l\'utilise.', 'Les images alpine, busybox, redis et httpd sont supprimées ; nginx reste.'),
     S('Contrôlez : <code>docker system df</code>.', 'Pour vérifier le résultat avec la même mesure qu\'au départ.', 'La colonne RECLAIMABLE est retombée à 0 ou presque.')]),
  ],
  recap: ['Docker ne supprime rien de lui-même : à vous de nettoyer.', 'prune supprime l\'inutilisé (référencé par aucun conteneur) et épargne ce qui sert.', 'Ordre : conteneurs → volumes → images.', 'volume prune sans -a : seulement les volumes anonymes (Docker ≥ 23).'],
  build(lab) { NS.execLines(lab, ['docker volume create vieux-donnees', 'docker run -d --name prod-web -p 8080:80 -v prod-data:/data nginx', 'docker run --name tmp1 alpine echo un', 'docker run --name tmp2 -v vieux-donnees:/d alpine echo deux', 'docker run --name tmp3 busybox echo trois', 'docker pull redis:7', 'docker pull httpd']); },
  solve: solveWith(['docker system df', 'docker container prune -f', 'docker volume prune -a -f', 'docker image prune -a -f', 'docker system df']),
  checks: [
    { label: 'Le conteneur « prod-web » tourne toujours', run: c => c.running('prod-web') },
    { label: 'Plus aucun conteneur arrêté', run: c => c.count('exited') === 0 },
    { label: 'Plus aucun volume inutilisé (prod-data, utilisé, est conservé)', run: c => c.unusedVolumes() === 0 && c.volume('prod-data') },
    { label: 'Plus aucune image inutilisée (nginx, utilisée, est conservée)', run: c => c.unusedImages() === 0 && c.image('nginx') },
  ],
});

SC.push({
  id: 'ports-env', diff: 2, cat: 'Conteneurs', level: 'Intermédiaire', duration: '35 min', title: 'Publier des ports et configurer par variables',
  desc: 'Deux sites web et une base de données doivent cohabiter. Le port 8080 est déjà occupé : organisez les ports et configurez PostgreSQL par variables d\'environnement.',
  objectives: ['Publier un port avec -p et éviter les conflits', 'Configurer une image avec -e', 'Diagnostiquer un démarrage raté avec docker logs'],
  parts: [
    P('Plusieurs conteneurs, un seul hôte', [
      'Chaque conteneur a sa <b>propre pile réseau</b> : deux conteneurs peuvent tous les deux écouter sur leur port 80 sans se gêner. Mais l\'hôte n\'a qu\'un seul port 8080 : en publiant, vous devez choisir des ports d\'hôte <b>différents</b> (8080, 8081…) vers le même port 80 de conteneur.',
      '<code>docker port NOM</code> rappelle la correspondance de ports d\'un conteneur.'],
    [S('Regardez ce qui tourne : <code>docker ps</code>.', 'Il faut connaître les ports déjà pris avant d\'en choisir un.', 'Le conteneur <b>site1</b> (nginx) occupe 8080.'),
     S('Lancez un second site avec Apache sur le port 8081 : <code>docker run -d --name site2 -p 8081:80 httpd</code>.', 'httpd (Apache) écoute aussi sur le port 80 <i>dans</i> son conteneur ; on le publie sur 8081 côté hôte pour éviter le conflit avec site1.', 'Un identifiant long. Testez : <code>curl localhost:8081</code> affiche « It works! ».'),
     S('Vérifiez la publication : <code>docker port site2</code>.', 'Pour lire la correspondance sans deviner.', '« 80/tcp -> 0.0.0.0:8081 »')]),
    P('Configurer un conteneur : les variables d\'environnement', [
      'Une image est un modèle <b>générique</b> : on l\'adapte au démarrage avec des <b>variables d\'environnement</b>, passées par <code>-e NOM=valeur</code>. Aucun fichier à modifier, rien à reconstruire. C\'est le mécanisme standard de configuration des conteneurs.',
      'L\'image <b>postgres</b> exige par exemple <code>POSTGRES_PASSWORD</code> (le mot de passe du super-utilisateur) ; elle accepte aussi <code>POSTGRES_DB</code> (nom d\'une base à créer). Si le mot de passe manque, le conteneur refuse de démarrer.'],
    [S('Lancez une base <b>sans</b> variable : <code>docker run -d --name db postgres</code>, puis lisez <code>docker logs db</code>.', 'C\'est volontaire : savoir lire l\'échec est une compétence essentielle. Le conteneur démarre puis s\'arrête immédiatement.', 'Dans les journaux : « Database is uninitialized and superuser password is not specified ». <code>docker ps -a</code> montre <i>Exited (1)</i> : un code différent de 0 indique une erreur.'),
     S('Supprimez-le puis recréez-le correctement : <code>docker rm db</code> puis <code>docker run -d --name db -e POSTGRES_PASSWORD=secret -e POSTGRES_DB=appdb postgres</code>.', 'On ne peut pas ajouter une variable à un conteneur existant : on le recrée. Le nom « db » doit être libéré d\'abord.', 'Cette fois le conteneur reste <i>Up</i>. <code>docker logs db</code> se termine par « database system is ready to accept connections ».', [['-e POSTGRES_PASSWORD=secret', 'définit la variable (le mot de passe)'], ['-e POSTGRES_DB=appdb', 'crée une base nommée appdb au premier démarrage']]),
     S('Contrôlez l\'ensemble : <code>docker ps</code>.', 'Trois services doivent tourner de front.', 'site1, site2 et db en <i>Up</i>.')]),
  ],
  recap: ['Ports de conteneur identiques, ports d\'hôte différents.', '-e NOM=valeur configure un conteneur au démarrage.', 'Un conteneur qui s\'arrête aussitôt : docker logs puis le code de sortie disent pourquoi.', 'Pour changer une variable, on recrée le conteneur.'],
  build(lab) { NS.execLines(lab, ['docker run -d --name site1 -p 8080:80 nginx']); },
  solve: solveWith(['docker run -d --name site2 -p 8081:80 httpd', 'curl localhost:8081', 'docker run -d --name db postgres', 'docker logs db', 'docker rm db', 'docker run -d --name db -e POSTGRES_PASSWORD=secret -e POSTGRES_DB=appdb postgres', 'docker ps']),
  checks: [
    { label: 'site1 (nginx) tourne toujours sur le port 8080', run: c => c.running('site1') && c.published('site1', 8080, 80) },
    { label: 'site2 est un serveur httpd en cours d\'exécution', run: c => c.running('site2') && c.imageOf('site2') === 'httpd' },
    { label: 'http://localhost:8081 répond « It works! »', run: c => c.http('http://localhost:8081').body.includes('It works!') },
    { label: 'La base « db » (postgres) tourne', run: c => c.running('db') && c.imageOf('db') === 'postgres' },
    { label: 'db est configurée avec POSTGRES_PASSWORD et POSTGRES_DB=appdb', run: c => !!c.env('db', 'POSTGRES_PASSWORD') && c.env('db', 'POSTGRES_DB') === 'appdb' },
  ],
});

SC.push({
  id: 'depannage', diff: 2, cat: 'Conteneurs', level: 'Intermédiaire', duration: '30 min', title: 'Dépannage : le conteneur qui s\'arrête tout seul',
  desc: 'Une base de données ne démarre plus et un conteneur redémarre en boucle. Diagnostiquez avec ps, logs et inspect, puis réparez.',
  objectives: ['Lire l\'état et le code de sortie d\'un conteneur', 'Utiliser logs et inspect pour trouver une cause', 'Comprendre les politiques de redémarrage'],
  parts: [
    P('Méthode de diagnostic', [
      'Devant un conteneur en panne, on suit toujours le même fil : <b>1) l\'état</b> (<code>docker ps -a</code>) ; <b>2) les journaux</b> (<code>docker logs</code>) qui contiennent presque toujours le message d\'erreur ; <b>3) la configuration</b> (<code>docker inspect</code>) si le journal ne suffit pas.',
      'Le <b>code de sortie</b> donne une indication : 0 = fin normale, 1 = erreur générale de l\'application, 125-127 = Docker ou la commande n\'a pas pu démarrer, 137 = tué (SIGKILL), 143 = arrêté proprement (SIGTERM).'],
    [S('Observez : <code>docker ps -a</code>.', 'Première étape de toute enquête.', '<b>base-clients</b> est <i>Exited (1)</i> ; <b>cache-fou</b> est <i>Restarting</i>.'),
     S('Cherchez la cause : <code>docker logs base-clients</code>.', 'Le démarrage de la base a laissé un message : c\'est là qu\'on trouve la raison.', 'Un message qui commence par « Error: Database is uninitialized and superuser password is not specified ».')]),
    P('Réparer', [
      'Les variables d\'environnement d\'un conteneur sont fixées à sa création. Pour en changer, on <b>supprime et recrée</b> le conteneur (les données, elles, survivent si elles sont dans un volume).'],
    [S('Recréez la base avec un mot de passe : <code>docker rm base-clients</code> puis <code>docker run -d --name base-clients -e POSTGRES_PASSWORD=motdepasse postgres</code>.', 'La cause était le mot de passe manquant ; on le fournit avec -e, comme dans le TP précédent.', 'Le conteneur reste <i>Up</i>.')]),
    P('Les politiques de redémarrage', [
      'L\'option <code>--restart</code> dit à Docker quoi faire quand le processus s\'arrête : <code>no</code> (défaut : rien), <code>on-failure[:N]</code> (relancer si code ≠ 0, N fois au plus), <code>always</code> (toujours relancer) et <code>unless-stopped</code> (toujours, sauf si vous l\'avez arrêté vous-même).',
      'Utile pour un serveur qui doit rester disponible. Mais si le programme plante dès le départ, <b>Docker le relance indéfiniment</b>, avec un délai qui double à chaque essai : c\'est une boucle de redémarrage.'],
    [S('Observez la boucle : <code>docker ps</code> puis <code>docker inspect -f "{{.RestartCount}}" cache-fou</code>.', '<code>-f</code> (format) extrait un champ précis du JSON d\'inspect, ici le nombre de redémarrages déjà effectués.', 'Statut <i>Restarting (3)</i> et un compteur qui augmente à chaque essai.', [['inspect', 'affiche la configuration complète (JSON)'], ['-f "{{.RestartCount}}"', 'gabarit Go : ne garde que le champ RestartCount']]),
     S('Arrêtez la boucle : <code>docker rm -f cache-fou</code>.', 'Un conteneur en boucle ne se laisse pas supprimer sans <code>-f</code> (il faut d\'abord l\'arrêter).', 'Le nom s\'affiche. <code>docker ps -a</code> ne montre plus que <b>base-clients</b>, en <i>Up</i>.')]),
  ],
  recap: ['Diagnostic : ps -a → logs → inspect.', 'Code de sortie ≠ 0 : erreur ; 137 = SIGKILL.', 'Les variables d\'un conteneur se changent en le recréant.', '--restart always relance sans fin un programme qui plante : surveillez RestartCount.'],
  build(lab) { NS.execLines(lab, ['docker run -d --name base-clients postgres', 'docker run -d --name cache-fou --restart always alpine sh -c "echo plantage; exit 3"']); lab.clock.runFor(4000); },
  solve: solveWith(['docker logs base-clients', 'docker rm base-clients', 'docker run -d --name base-clients -e POSTGRES_PASSWORD=motdepasse postgres', 'docker rm -f cache-fou', 'docker ps -a']),
  checks: [
    { label: 'base-clients tourne', run: c => c.running('base-clients') },
    { label: 'base-clients a reçu un mot de passe (POSTGRES_PASSWORD)', run: c => !!c.env('base-clients', 'POSTGRES_PASSWORD') },
    { label: 'cache-fou a été supprimé (plus de boucle de redémarrage)', run: c => !c.exists('cache-fou') },
  ],
});

SC.push({
  id: 'volume-nomme', diff: 2, cat: 'Données', level: 'Intermédiaire', duration: '35 min', title: 'Volumes : garder ses données quand le conteneur disparaît',
  desc: 'Un conteneur est jetable, pas ses données. Faites survivre un site web à la suppression de son conteneur grâce à un volume nommé.',
  objectives: ['Expliquer pourquoi les données d\'un conteneur sont éphémères', 'Créer et monter un volume nommé', 'Prouver la persistance en recréant le conteneur'],
  parts: [
    P('Pourquoi des volumes ?', [
      'Tout ce qu\'un conteneur écrit dans son système de fichiers va dans sa fine <b>couche d\'écriture</b>, qui est <b>détruite avec le conteneur</b>. C\'est voulu : on peut jeter et recréer un conteneur à volonté. Mais pour une base de données ou un site modifiable, il faut des données qui <b>survivent</b>.',
      'Un <b>volume</b> est un espace de stockage géré par Docker, indépendant des conteneurs. On le <b>monte</b> à un endroit du conteneur avec <code>-v NOM:CHEMIN</code> : tout ce qui est écrit dans ce dossier va dans le volume. Quand le conteneur disparaît, le volume reste et peut être remonté dans un autre.',
      'Au tout premier montage d\'un volume vide, Docker le <b>remplit avec le contenu que l\'image avait déjà à cet endroit</b> (ici la page d\'accueil de nginx).'],
    [S('Créez le volume : <code>docker volume create site</code> puis <code>docker volume ls</code>.', 'On pourrait laisser <code>run</code> le créer automatiquement ; le créer soi-même rend l\'étape visible.', 'Une ligne <code>local  site</code> dans la liste.', [['volume create site', 'crée un volume nommé « site »'], ['local', 'pilote de stockage : sur le disque de l\'hôte']]),
     S('Lancez nginx avec ce volume : <code>docker run -d --name web -p 8080:80 -v site:/usr/share/nginx/html nginx</code>.', '/usr/share/nginx/html est le dossier que nginx publie. En y montant le volume, on rend le site persistant.', 'Un identifiant long, puis <code>curl localhost:8080</code> affiche la page nginx par défaut (copiée dans le volume au premier montage).', [['-v site:/usr/share/nginx/html', 'monte le volume « site » sur ce dossier du conteneur']])]),
    P('Modifier puis détruire', [
      'On va maintenant écrire dans le volume depuis l\'intérieur du conteneur avec <code>docker exec</code> (exécuter une commande dans un conteneur <b>déjà en cours</b>), puis détruire le conteneur pour vérifier que la donnée survit.'],
    [S('Changez la page : <code>docker exec web sh -c "echo Bonjour de Formaxion &gt; /usr/share/nginx/html/index.html"</code> puis <code>curl localhost:8080</code>.', 'On passe par <code>sh -c</code> pour que la redirection <code>&gt;</code> soit exécutée <i>dans</i> le conteneur et non sur l\'hôte.', 'curl affiche « Bonjour de Formaxion ».', [['exec web', 'exécute dans le conteneur « web »'], ['sh -c "…"', 'lance un shell qui exécute la chaîne entre guillemets']]),
     S('<b>Expérience :</b> supprimez le conteneur : <code>docker rm -f web</code>, puis <code>docker volume ls</code>.', 'On détruit le conteneur pour voir si la donnée disparaît avec lui.', 'Le conteneur a disparu, mais le volume <b>site</b> est toujours là.'),
     S('Recréez un conteneur <b>web2</b> avec le <b>même volume</b> : <code>docker run -d --name web2 -p 8080:80 -v site:/usr/share/nginx/html nginx</code>, puis <code>curl localhost:8080</code>.', 'Un nouveau conteneur, une nouvelle couche d\'écriture — mais le volume est le même.', 'curl affiche toujours « Bonjour de Formaxion » : la donnée a survécu.')]),
    P('Pour comparer : sans volume', [
      'Sans <code>-v</code>, ce qu\'on écrit disparaît avec le conteneur. <code>--rm</code> supprime le conteneur à sa fin, ce qui rend l\'expérience immédiate.'],

SC.push({
  id: 'dockerfile-1', diff: 2, cat: 'Images', level: 'Intermédiaire', duration: '40 min', title: 'Votre première image : un Dockerfile pour un site web',
  desc: 'Le dossier ~/projet-web contient une page HTML. Écrivez un Dockerfile qui l\'embarque dans une image nginx, construisez l\'image et lancez-la.',

  parts: [
    P('Du code à l\'image', [
      'Une <b>image</b> est un modèle en lecture seule, composé de <b>couches</b> empilées. Un <b>Dockerfile</b> est la « recette » : un fichier texte dont chaque <b>instruction</b> ajoute une couche. <code>docker build</code> lit cette recette et fabrique l\'image : c\'est reproductible, versionnable avec le code, et identique chez tout le monde.',

    P('Construire et lancer', [
      '<code>docker build -t NOM:TAG CONTEXTE</code> construit l\'image. <code>-t</code> la <b>nomme</b> (sans nom, elle n\'a qu\'un identifiant). Le point <code>.</code> désigne le dossier courant comme contexte. Docker affiche une étape par instruction.'],

SC.push({

    [S('Allez dans le dossier : <code>cd ~/projet-salut &amp;&amp; cat salut.sh</code>.', 'Le script que l\'image devra exécuter est déjà fourni ; on le lit pour savoir quelle variable il utilise.', 'Un script qui affiche « Bonjour » suivi de la variable NOM.')]),
    P('Écrire le Dockerfile', [
      'L\'ordre compte : on met en haut ce qui change rarement (base, paquets) et en bas ce qui change souvent (vos fichiers) — nous verrons pourquoi dans le TP sur le cache.'],
    [S('Créez le fichier Dockerfile (avec <code>nano Dockerfile</code>) contenant : <code>FROM alpine:3.20</code>, <code>RUN apk add --no-cache curl</code>, <code>ENV NOM=monde</code>, <code>WORKDIR /app</code>, <code>COPY salut.sh .</code>, <code>CMD ["sh", "salut.sh"]</code>.', 'Chaque ligne a un rôle : base, outil installé dans l\'image, valeur par défaut configurable, dossier de travail, fichier applicatif, commande de démarrage.', '<code>cat Dockerfile</code> affiche les six lignes.', [['apk add --no-cache', 'installe un paquet Alpine sans conserver le cache de l\'index (image plus légère)'], ['WORKDIR /app', 'les instructions suivantes (et le conteneur) démarrent dans /app'], ['COPY salut.sh .', 'le « . » est le WORKDIR : le script arrive dans /app']]),

    { label: 'Le script est dans /app (WORKDIR + COPY)', run: c => /NOM/.test(c.imgFile('salut:1', '/app/salut.sh') || '') },

/* ================================================= Cache */
SC.push({
  id: 'dockerfile-cache', diff: 3, cat: 'Images', level: 'Avancé', duration: '45 min', title: 'Le cache de build : bien ordonner son Dockerfile',
  desc: 'Une application Python est construite avec un Dockerfile mal ordonné : chaque modification du code réinstalle toutes les dépendances. Corrigez l\'ordre des instructions.',
  objectives: ['Expliquer le fonctionnement du cache de couches', 'Repérer les étapes CACHED', 'Réordonner un Dockerfile pour en tirer parti'],
  parts: [

    P('Constater le problème', [
      'Le premier build ne peut rien réutiliser. C\'est le deuxième build, après une modification, qui révèle l\'efficacité du cache.'],
    [S('Construisez : <code>docker build -t api:1 .</code>.', 'Premier build : toutes les étapes sont exécutées.', 'Aucune mention CACHED.'),
     S('Modifiez le code : <code>echo "print(\'v2\')" &gt;&gt; app.py</code>, puis relancez <code>docker build -t api:2 .</code>.', 'Un simple changement de code devrait être rapide.', 'L\'étape <code>RUN pip install</code> est <b>refaite</b> (pas de CACHED) alors que les dépendances n\'ont pas changé : c\'est le défaut.', [])]),
    P('Corriger l\'ordre', [
      'Solution : copier d\'abord <b>uniquement</b> <code>requirements.txt</code>, installer, puis copier le reste du code.'],
    [S('Remplacez le Dockerfile par : <code>FROM python:3.12-slim</code>, <code>WORKDIR /app</code>, <code>COPY requirements.txt .</code>, <code>RUN pip install -r requirements.txt</code>, <code>COPY . .</code>, <code>CMD ["python", "app.py"]</code>.', 'L\'installation ne dépend plus que de requirements.txt : tant qu\'il ne change pas, la couche reste en cache.', '<code>cat Dockerfile</code> montre le nouvel ordre.'),
     S('Construisez, modifiez le code, reconstruisez : <code>docker build -t api:3 .</code>, <code>echo "print(\'v4\')" &gt;&gt; app.py</code>, <code>docker build -t api:4 .</code>.', 'Pour vérifier le gain.', 'Au dernier build, <code>RUN pip install</code> affiche <b>CACHED</b>.')]),
  ],
  recap: ['Une couche invalidée invalide toutes les suivantes.', 'Dépendances d\'abord, code ensuite.', 'CACHED dans la sortie de build = couche réutilisée.'],
  build(lab) {
    W(lab, '/home/student/projet-api/app.py', 'print("API démarrée")\n');
    W(lab, '/home/student/projet-api/requirements.txt', 'flask==3.0.3\nrequests==2.32.3\n');
    W(lab, '/home/student/projet-api/Dockerfile', 'FROM python:3.12-slim\nWORKDIR /app\nCOPY . .\nRUN pip install -r requirements.txt\nCMD ["python", "app.py"]\n');
  },
  solve: solveWith(['cd /home/student/projet-api', 'docker build -t api:1 .', 'echo "print(\'v2\')" >> app.py', 'docker build -t api:2 .', 'printf "FROM python:3.12-slim\\nWORKDIR /app\\nCOPY requirements.txt .\\nRUN pip install -r requirements.txt\\nCOPY . .\\nCMD [\\"python\\", \\"app.py\\"]\\n" > Dockerfile', 'docker build -t api:3 .', 'echo "print(\'v4\')" >> app.py', 'docker build -t api:4 .']),
  checks: [
    { label: 'Dans le Dockerfile, requirements.txt est copié avant d\'installer, et le code après', run: c => { const t = c.hostFile('/home/student/projet-api/Dockerfile') || ''; const a = t.search(/COPY\s+requirements\.txt/), b = t.search(/RUN\s+pip install/), d = t.search(/COPY\s+\.\s+\./); return a >= 0 && b > a && d > b; } },
    { label: 'Le dernier build a réutilisé le cache pour pip install', run: c => { const b = c.lastBuild(); return !!b && b.ok && b.steps.some(s => /pip install/.test(s.label) && s.cached); } },
    { label: 'Une image api existe', run: c => c.image('api:3') || c.image('api:4') },
  ],
});
})(typeof window !== 'undefined' ? window : globalThis);

<script>
/* tp_compose.js — TP Docker Compose : décrire une application multi-conteneurs dans un fichier. */
(function (g) {
'use strict';
const NS = g.NS; const SC = NS.SCENARIOS; const P = NS.tpP, S = NS.tpS, solveWith = NS.solveWith;
const W = (lab, p, d) => { lab.hostFs.writep(p, d); };
/* commande qui écrit un fichier (utilisée par les corrections) */
const pf = (path, text) => "printf '" + text.replace(/\\/g, '\\\\').replace(/\n/g, '\\n') + "' > " + path;
const pre = t => '<pre>' + t.replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</pre>';

const BOUTIQUE = 'services:\n  web:\n    image: nginx\n    ports:\n      - "8080:80"\n  cache:\n    image: redis\n';

/* ================================================= 1. Découverte */
SC.push({
  id: 'compose-decouverte', diff: 2, cat: 'Compose', level: 'Intermédiaire', duration: '40 min', title: 'Docker Compose : lancer une application en une commande',
  desc: 'Une boutique est composée d\'un serveur web et d\'un cache Redis. Au lieu de deux « docker run », un seul fichier Compose décrit l\'ensemble.',
  objectives: ['Expliquer à quoi sert Docker Compose', 'Lire un fichier compose.yaml (services, image, ports)', 'Utiliser up, ps, logs, stop, start', 'Identifier ce que Compose crée automatiquement (réseau, noms)'],
  parts: [
    P('Pourquoi Compose ?', [
      'Une application réelle compte plusieurs conteneurs : un serveur web, une base de données, un cache… Les lancer avec <code>docker run</code> exige de retenir pour chacun une longue liste d\'options (réseau, ports, volumes, variables) et de les exécuter <b>dans le bon ordre</b>. C\'est long, source d\'erreurs, et impossible à partager proprement.',
      '<b>Docker Compose</b> résout ce problème : on décrit toute l\'application dans <b>un fichier texte</b> (<code>compose.yaml</code>) et on la pilote avec <code>docker compose …</code>. Ce fichier se versionne avec le code : n\'importe qui obtient le même environnement avec une seule commande.',
      'Le fichier est au format <b>YAML</b> : des couples <code>clé: valeur</code>, une <b>indentation par espaces</b> (jamais de tabulation) qui exprime l\'imbrication, et des listes introduites par un tiret. Sous la clé <code>services:</code> on déclare un bloc par conteneur ; <b>le nom du service</b> sert aussi de nom DNS pour que les services se joignent entre eux.'],
    [S('Allez dans le projet et regardez-le : <code>cd ~/boutique &amp;&amp; ls</code>.', 'Compose cherche automatiquement un fichier <b>compose.yaml</b> dans le dossier courant. Le <b>nom du dossier</b> devient le nom du <i>projet</i>.', 'Un seul fichier : <code>compose.yaml</code>.'),
     S('Lisez le fichier : <code>cat compose.yaml</code>.', 'Avant de lancer quoi que ce soit, on lit : c\'est le « plan » de l\'application.', 'Deux services : <b>web</b> (image nginx, port 8080 de l\'hôte vers 80 du conteneur) et <b>cache</b> (image redis). Notez les espaces d\'indentation.', [['services:', 'liste des conteneurs de l\'application'], ['web:', 'nom du service (aussi son nom DNS)'], ['image: nginx', 'image utilisée (comme l\'argument de docker run)'], ['ports: - "8080:80"', 'équivalent de -p 8080:80']]),
     S('Faites afficher la version « comprise » par Docker : <code>docker compose config</code>.', 'La commande valide le fichier et le réécrit avec toutes les valeurs explicites. C\'est le meilleur réflexe pour détecter une erreur <i>avant</i> de lancer.', 'Le même fichier en version complète : le nom du projet (<code>name: boutique</code>), un réseau <code>boutique_default</code> apparu tout seul, les ports en notation détaillée.')]),
    P('Démarrer le projet', [
      '<code>docker compose up</code> crée tout ce qui manque : le <b>réseau</b> du projet, puis un conteneur par service. Les noms suivent le modèle <code>projet-service-numéro</code> (ici <code>boutique-web-1</code>). Avec <code>-d</code> (detached), le terminal est rendu ; sans lui, il affiche les journaux de tous les services jusqu\'à Ctrl+C.',
      'Ce sont de <b>vrais conteneurs Docker ordinaires</b> : Compose ne fait que lancer pour vous les commandes que vous écririez à la main, et pose des <i>étiquettes</i> (labels) pour retrouver ses conteneurs.'],
    [S('Lancez : <code>docker compose up -d</code>.', 'Compose télécharge les images absentes, crée le réseau puis démarre les deux conteneurs.', 'Un bloc « [+] Running » : les images téléchargées (Pulled), le réseau <code>boutique_default</code> (Created), puis <code>boutique-web-1</code> et <code>boutique-cache-1</code> (Started).', [['up', 'crée et démarre les services'], ['-d', 'en arrière-plan']]),
     S('Listez les services du projet : <code>docker compose ps</code>.', 'Comme docker ps, mais limité à ce projet et avec une colonne SERVICE.', 'Deux lignes « Up », le port <code>0.0.0.0:8080-&gt;80/tcp</code> pour web.'),
     S('Testez le site : <code>curl localhost:8080</code>.', 'Le port 8080 de l\'hôte est publié grâce à la ligne <code>ports</code> du fichier.', 'La page « Welcome to nginx! ».'),
     S('Lisez les journaux du cache : <code>docker compose logs cache</code>.', 'Compose agrège les journaux ; chaque ligne est préfixée du nom du conteneur. Sans nom de service, il affiche tous les services.', 'Les lignes de démarrage de Redis, préfixées par <code>boutique-cache-1  |</code>.'),
     S('Regardez le réseau : <code>docker network ls</code>.', 'Compose a créé un réseau dédié au projet : les conteneurs s\'y joignent par le <b>nom de leur service</b>.', 'Un réseau <code>boutique_default</code> en plus de bridge, host et none.')]),
    P('Arrêter, redémarrer', [
      '<code>stop</code> arrête les conteneurs sans les supprimer, <code>start</code> les redémarre. <code>down</code> (à retenir !) arrête <b>et supprime</b> les conteneurs et le réseau — mais conserve les volumes. <code>up</code> est <b>idempotent</b> : relancé alors que rien n\'a changé, il ne recrée rien.'],
    [S('Arrêtez : <code>docker compose stop</code>, puis <code>docker compose ps -a</code>.', '<code>ps</code> seul n\'affiche que les conteneurs en cours ; <code>-a</code> montre aussi ceux qui sont arrêtés.', 'Les deux conteneurs sont « Exited ».'),
     S('Redémarrez : <code>docker compose start</code>, puis <code>docker compose up -d</code>.', 'start relance les conteneurs existants. up -d ensuite constate que tout tourne déjà et ne change rien.', 'Pour up -d : « Running » (et non « Started ») devant chaque conteneur : rien n\'a été recréé.')]),
  ],
  recap: ['Un fichier compose.yaml décrit l\'application ; docker compose up -d la démarre.', 'Le nom du dossier devient le nom du projet : conteneurs « projet-service-1 », réseau « projet_default ».', 'Le nom d\'un service est son nom DNS dans le réseau du projet.', 'down supprime conteneurs et réseau (pas les volumes) ; stop/start conservent les conteneurs.', 'docker compose config valide et affiche le fichier tel que Docker le comprend.'],
  build(lab) { W(lab, '/home/student/boutique/compose.yaml', BOUTIQUE); },
  solve: solveWith(['cd /home/student/boutique', 'cat compose.yaml', 'docker compose config', 'docker compose up -d', 'docker compose ps', 'curl localhost:8080', 'docker compose logs cache', 'docker network ls', 'docker compose stop', 'docker compose ps -a', 'docker compose start', 'docker compose up -d']),
  checks: [
    { label: 'Le service web (boutique-web-1) tourne, port 8080 publié', run: c => c.running('boutique-web-1') && c.published('boutique-web-1', 8080, 80) },
    { label: 'Le service cache (boutique-cache-1) tourne', run: c => c.running('boutique-cache-1') },
    { label: 'Le réseau boutique_default a été créé par Compose', run: c => c.network('boutique_default') && c.onNet('boutique-web-1', 'boutique_default') && c.onNet('boutique-cache-1', 'boutique_default') },
    { label: 'http://localhost:8080 répond', run: c => c.http('http://localhost:8080').body.includes('nginx') },
  ],
});

/* ================================================= 2. Écrire son fichier */
const VITRINE = 'services:\n  site:\n    image: nginx:alpine\n    ports:\n      - "8081:80"\n    volumes:\n      - ./html:/usr/share/nginx/html:ro\n  cache:\n    image: redis\n    restart: unless-stopped\n    volumes:\n      - cache-data:/data\nvolumes:\n  cache-data:\n';
SC.push({
  id: 'compose-ecrire', diff: 2, cat: 'Compose', level: 'Intermédiaire', duration: '45 min', title: 'Écrire son propre fichier Compose',
  desc: 'À partir d\'un cahier des charges, écrivez le fichier compose.yaml d\'un site statique et de son cache, avec bind mount, volume nommé et politique de redémarrage.',
  objectives: ['Écrire un fichier Compose valide (YAML)', 'Traduire des options de docker run : ports, volumes, restart', 'Déclarer un volume nommé au niveau racine', 'Valider avec docker compose config'],
  parts: [
    P('Du docker run au fichier Compose', [
      'Chaque option de <code>docker run</code> a son équivalent dans un service : <code>-p 8081:80</code> devient la liste <code>ports</code>, <code>-v dossier:/chemin:ro</code> devient la liste <code>volumes</code>, <code>--restart unless-stopped</code> devient <code>restart</code>, <code>-e VAR=x</code> devient <code>environment</code>.',
      'Deux règles à connaître. 1) Un <b>volume nommé</b> doit être <b>déclaré</b> dans la section racine <code>volumes:</code> (sinon Compose refuse le fichier). 2) Un chemin <b>relatif</b> comme <code>./html</code> est calculé par rapport au dossier du fichier Compose : on peut donc déplacer tout le projet sans rien changer.',
      'Cahier des charges : un service <b>site</b> (nginx:alpine) publié sur le port <b>8081</b>, qui sert le dossier <code>./html</code> monté en <b>lecture seule</b> ; un service <b>cache</b> (redis) qui redémarre automatiquement sauf arrêt volontaire, avec ses données dans un volume nommé <b>cache-data</b>.'],
    [S('Allez dans le dossier : <code>cd ~/vitrine &amp;&amp; ls</code>.', 'Le site (dossier html) existe déjà, mais il n\'y a pas encore de fichier Compose.', 'Un dossier <code>html</code>.'),
     S('Créez le fichier avec l\'éditeur : <code>nano compose.yaml</code>, puis recopiez le contenu ci-dessous (Ctrl+O, Entrée, Ctrl+X). Attention : <b>2 espaces</b> par niveau, <b>aucune tabulation</b>.' + pre(VITRINE), 'L\'indentation est la syntaxe même du YAML : une ligne mal décalée change le sens, ou rend le fichier invalide. Si vous bloquez, « Charger la correction » écrit le fichier à votre place.', '<code>cat compose.yaml</code> affiche le fichier.', [['./html:/usr/share/nginx/html:ro', 'dossier du projet : dossier de nginx, en lecture seule'], ['cache-data:/data', 'volume nommé : dossier où Redis stocke ses données'], ['restart: unless-stopped', 'redémarre sauf si vous avez arrêté le conteneur vous-même'], ['volumes: cache-data:', 'déclaration du volume nommé (au niveau racine)']])]),
    P('Valider puis démarrer', [
      '<code>docker compose config -q</code> (<i>quiet</i>) ne fait que vérifier : il n\'affiche rien si le fichier est valide, et une erreur précise sinon. Prenez l\'habitude de le lancer avant chaque <code>up</code>.'],
    [S('Validez : <code>docker compose config -q</code>.', 'Pour détecter une faute de frappe avant de démarrer.', 'Aucune sortie : le fichier est valide. (En cas d\'erreur, lisez le message : il cite la ligne ou le service en cause.)'),
     S('Démarrez : <code>docker compose up -d</code>, puis <code>curl localhost:8081</code>.', 'Compose crée le réseau, le volume <code>vitrine_cache-data</code> (préfixé par le projet), puis les deux conteneurs.', 'Le contenu de votre page (« Vitrine »).'),
     S('Modifiez la page sur l\'hôte : <code>echo "&lt;h1&gt;Vitrine v2&lt;/h1&gt;" &gt; html/index.html</code>, puis <code>curl localhost:8081</code>.', 'Le bind mount relie le dossier de l\'hôte au conteneur : la modification est visible tout de suite, sans redémarrer.', '« Vitrine v2 ».'),
     S('Observez le volume : <code>docker volume ls</code>.', 'Compose préfixe le nom du volume par celui du projet pour éviter les collisions entre projets.', 'Un volume nommé <code>vitrine_cache-data</code>.')]),
  ],
  recap: ['Chaque option de docker run a son équivalent dans le service (ports, volumes, restart, environment…).', 'Un volume nommé s\'utilise dans le service ET se déclare dans la section racine volumes.', 'Les chemins relatifs sont relatifs au fichier Compose.', 'docker compose config -q valide un fichier sans rien lancer.'],
  build(lab) { W(lab, '/home/student/vitrine/html/index.html', '<h1>Vitrine</h1>\n'); },
  solve: solveWith(['cd /home/student/vitrine', pf('compose.yaml', VITRINE), 'docker compose config -q', 'docker compose up -d', 'curl localhost:8081', 'echo "<h1>Vitrine v2</h1>" > html/index.html', 'curl localhost:8081', 'docker volume ls']),
  checks: [
    { label: 'compose.yaml existe et déclare les services site et cache', run: c => { const y = c.yaml('/home/student/vitrine/compose.yaml'); return !!y && !!y.services && !!y.services.site && !!y.services.cache; } },

  parts: [

/* ================================================= 4. Données, santé, ordre */
const DONNEES = 'services:\n  db:\n    image: postgres:16\n    environment:\n      POSTGRES_PASSWORD: secret\n    volumes:\n      - pgdata:/var/lib/postgresql/data\n    healthcheck:\n      test: ["CMD-SHELL", "pg_isready -U postgres"]\n      interval: 5s\n      retries: 5\n  web:\n    image: nginx\n    ports:\n      - "8083:80"\n    depends_on:\n      db:\n        condition: service_healthy\n  notes:\n    image: alpine\n    command: sleep 3600\n    volumes:\n      - notes:/data\nvolumes:\n  pgdata:\n  notes:\n';
SC.push({
  id: 'compose-donnees', diff: 3, cat: 'Compose', level: 'Avancé', duration: '50 min', title: 'Ordre de démarrage, santé et persistance des données',
  desc: 'Le site ne doit démarrer qu\'une fois la base prête, et les données doivent survivre à un « docker compose down ».',
  objectives: ['Utiliser depends_on avec condition: service_healthy', 'Lire l\'état de santé d\'un conteneur', 'Montrer que down conserve les volumes', 'Savoir quand utiliser down -v'],
  parts: [

      'La santé est mesurée par un <b>healthcheck</b> : une commande exécutée régulièrement <i>dans</i> le conteneur (<code>interval</code>). Si elle réussit (code 0), le conteneur est « healthy » ; après <code>retries</code> échecs de suite, il devient « unhealthy ». En attendant : « health: starting ».'],
    [S('Allez dans le projet et lisez-le : <code>cd ~/donnees &amp;&amp; cat compose.yaml</code>.', 'On repère le healthcheck de db (<code>pg_isready</code>, l\'outil PostgreSQL qui teste la disponibilité) et le depends_on de web.', 'Trois services : db, web (qui dépend de db « healthy »), notes (un petit conteneur alpine pour manipuler des fichiers).', [['test: ["CMD-SHELL", …]', 'la commande de test, exécutée dans un shell du conteneur'], ['interval: 5s', 'fréquence du test'], ['retries: 5', 'échecs consécutifs tolérés avant « unhealthy »'], ['condition: service_healthy', 'web attend que db soit sain']]),
     S('Démarrez : <code>docker compose up -d</code>.', 'Compose démarre db, <b>attend</b> son état sain, puis seulement web.', 'Dans le bloc final, <code>donnees-db-1</code> est « Healthy » et <code>donnees-web-1</code> « Started » : l\'attente est visible dans les durées.'),
     S('Regardez l\'état : <code>docker compose ps</code>.', 'La colonne STATUS indique la santé.', '<code>Up … (healthy)</code> pour db.')]),
    P('Les données survivent à down', [

    [S('Écrivez un fichier dans le volume : <code>docker compose exec notes sh -c "echo mes donnees &gt; /data/memo.txt"</code>.', 'On dépose une donnée dans le dossier /data du service notes, qui est un volume nommé.', 'Aucune sortie. <code>docker compose exec notes cat /data/memo.txt</code> affiche « mes donnees ».', [['exec notes', 'exécute une commande dans le service notes (pas besoin de connaître le nom du conteneur)'], ['sh -c "…"', 'lance un shell pour que la redirection > soit comprise DANS le conteneur']]),
     S('Supprimez tout le projet : <code>docker compose down</code>, puis <code>docker ps -a</code> et <code>docker volume ls</code>.', 'On détruit les conteneurs pour vérifier que les données, elles, subsistent.', 'Plus aucun conteneur, plus de réseau ; mais les volumes <code>donnees_pgdata</code> et <code>donnees_notes</code> sont toujours là.'),
     S('Recréez : <code>docker compose up -d</code>, puis <code>docker compose exec notes cat /data/memo.txt</code>.', 'De nouveaux conteneurs se rattachent aux mêmes volumes : les données sont retrouvées.', 'Le fichier est toujours là : « mes donnees ».')]),
  ],
  recap: ['depends_on ordonne ; avec condition: service_healthy il attend que le service soit réellement prêt.', 'healthcheck = commande de test exécutée régulièrement dans le conteneur ; STATUS montre (healthy).', 'down supprime conteneurs et réseau, pas les volumes ; down -v supprime aussi les volumes.', 'Les données à conserver vont dans un volume nommé.'],

  solve: solveWith(['cd /home/student/donnees', 'docker compose up -d', 'docker compose ps', 'docker compose exec notes sh -c "echo mes donnees > /data/memo.txt"', 'docker compose down', 'docker volume ls', 'docker compose up -d', 'docker compose exec notes cat /data/memo.txt']),

    { label: 'Le site donnees-web-1 tourne (port 8083)', run: c => c.running('donnees-web-1') && c.published('donnees-web-1', 8083, 80) },
    { label: 'Le fichier memo.txt a été écrit dans le volume donnees_notes', run: c => /mes donnees/.test(c.volFile('donnees_notes', '/memo.txt') || '') },
    { label: 'Le fichier est visible dans le NOUVEAU conteneur notes (recréé après down)', run: c => { const x = c.get('donnees-notes-1'); return !!x && x.running && /mes donnees/.test(c.inContainer('donnees-notes-1', '/data/memo.txt') || '') && c.lab.events.some(e => e.type === 'container' && e.action === 'destroy' && (e.attrs.name || '') === 'donnees-notes-1'); } },
  ],

/* ================================================= 5. Réseaux */
const TROIS = 'services:\n  front:\n    image: alpine\n    command: sleep 3600\n  api:\n    image: nginx\n  back:\n    image: alpine\n    command: sleep 3600\n';
const TROIS_OK = 'services:\n  front:\n    image: alpine\n    command: sleep 3600\n    networks:\n      - front\n  api:\n    image: nginx\n    networks:\n      - front\n      - back\n  back:\n    image: alpine\n    command: sleep 3600\n    networks:\n      - back\nnetworks:\n  front:\n  back:\n';

      'On déclare ses propres réseaux dans la section racine <code>networks:</code>, puis on rattache chaque service aux réseaux voulus avec une liste <code>networks:</code>. <b>Deux services qui n\'ont aucun réseau en commun ne peuvent ni se joindre ni même se résoudre par leur nom.</b> Le service « api », placé sur les deux réseaux, sert de passerelle.'],
    [S('Allez dans le projet et démarrez-le : <code>cd ~/trois-tiers &amp;&amp; docker compose up -d</code>.', 'Premier état : aucun réseau déclaré, donc tout est sur trois-tiers_default.', 'Trois conteneurs démarrés et un seul réseau créé : <code>trois-tiers_default</code>.'),
     S('Testez : <code>docker compose exec front ping -c 1 back</code>.', 'On constate le problème : front joint back directement.', 'Le ping réussit (« 1 packets transmitted, 1 received »).', [['exec front', 'lance la commande dans le service front'], ['ping -c 1 back', 'envoie un seul paquet vers le nom « back » (résolu par le DNS de Docker)']])]),
    P('Cloisonner', [
      'Objectif : réseau <b>front</b> pour front + api, réseau <b>back</b> pour api + back. Éditez <code>compose.yaml</code> : sous chaque service ajoutez la liste <code>networks</code> voulue, et déclarez <code>front:</code> et <code>back:</code> sous un <code>networks:</code> racine. Voici le fichier cible :' + pre(TROIS_OK)],
    [S('Modifiez le fichier (<code>nano compose.yaml</code>) pour obtenir le fichier cible ci-dessus, puis validez : <code>docker compose config -q</code>.', 'Un service qui cite un réseau non déclaré provoque une erreur de validation : config -q la détecte avant le démarrage.', 'Aucune sortie si le fichier est valide.'),
     S('Appliquez : <code>docker compose up -d</code>.', 'Compose détecte que la configuration des trois services a changé : il les <b>recrée</b> sur les nouveaux réseaux.', 'Deux nouveaux réseaux (<code>trois-tiers_front</code> et <code>trois-tiers_back</code>) et les trois conteneurs redémarrés.'),
     S('Testez l\'isolation : <code>docker compose exec front ping -c 1 back</code>, puis <code>docker compose exec front ping -c 1 api</code> et <code>docker compose exec back ping -c 1 api</code>.', 'Pour vérifier que front n\'atteint plus back, mais que l\'api reste joignable des deux côtés.', 'Premier ping : « bad address \'back\' » (le nom n\'est même plus résolu). Les deux autres réussissent.')]),
  ],
  recap: ['Sans configuration, tous les services partagent le réseau projet_default.', 'Réseaux déclarés à la racine, rattachés service par service avec networks.', 'Pas de réseau commun = pas de résolution de nom ni de communication.', 'Un service sur deux réseaux joue le rôle de passerelle.'],
  build(lab) { W(lab, '/home/student/trois-tiers/compose.yaml', TROIS); },
  solve: solveWith(['cd /home/student/trois-tiers', 'docker compose up -d', 'docker compose exec front ping -c 1 back', pf('compose.yaml', TROIS_OK), 'docker compose config -q', 'docker compose up -d', 'docker compose exec front ping -c 1 back', 'docker compose exec front ping -c 1 api', 'docker compose exec back ping -c 1 api']),
  checks: [
    { label: 'Les réseaux trois-tiers_front et trois-tiers_back existent', run: c => c.network('trois-tiers_front') && c.network('trois-tiers_back') },
    { label: 'front est sur le réseau front et api sur les deux', run: c => c.onNet('trois-tiers-front-1', 'trois-tiers_front') && c.onNet('trois-tiers-api-1', 'trois-tiers_front') && c.onNet('trois-tiers-api-1', 'trois-tiers_back') },
    { label: 'back n\'est que sur le réseau back', run: c => c.onNet('trois-tiers-back-1', 'trois-tiers_back') && !c.onNet('trois-tiers-back-1', 'trois-tiers_front') && !c.onNet('trois-tiers-back-1', 'trois-tiers_default') },

      'Point essentiel : Compose ne construit <b>qu\'une fois</b>. Si l\'image existe déjà, <code>up</code> la réutilise, <b>même si vous avez modifié le code</b>. Pour forcer la reconstruction : <code>docker compose up -d --build</code> (ou <code>docker compose build</code>).'],
    [S('Allez dans le projet : <code>cd ~/webbuild &amp;&amp; cat compose.yaml &amp;&amp; cat web/Dockerfile</code>.', 'On repère la ligne <code>build: ./web</code> et le Dockerfile du service.', 'Le service web a une clé <b>build</b> (pas de <b>image</b>) ; le Dockerfile copie index.html dans nginx.'),

    P('Modifier le code', [

    [S('Modifiez la page : <code>echo "&lt;h1&gt;Version 2&lt;/h1&gt;" &gt; web/index.html</code>, puis <code>docker compose up -d</code> et <code>curl localhost:8084</code>.', 'Pour constater le piège : Compose n\'a pas reconstruit l\'image.', 'La commande indique « Running » (rien ne change) et le site affiche toujours « Version 1 ».'),

  ],
  recap: ['build: dossier construit l\'image du service ; image: ne fait que la télécharger.', 'Compose ne reconstruit pas tout seul : utilisez up --build après une modification du code.', 'L\'image est nommée projet-service.', 'Le cache de couches s\'applique comme avec docker build.'],
  build(lab) {
    W(lab, '/home/student/webbuild/compose.yaml', 'services:\n  web:\n    build: ./web\n    ports:\n      - "8084:80"\n  cache:\n    image: redis\n');

  },
  solve: solveWith(['cd /home/student/webbuild', 'docker compose up -d', 'curl localhost:8084', 'echo "<h1>Version 2</h1>" > web/index.html', 'docker compose up -d', 'curl localhost:8084', 'docker compose up -d --build', 'curl localhost:8084', 'docker images']),
  checks: [
    { label: 'L\'image webbuild-web a été construite par Compose', run: c => c.image('webbuild-web') },
    { label: 'L\'image contient la « Version 2 »', run: c => /Version 2/.test(c.imgFile('webbuild-web', '/usr/share/nginx/html/index.html') || '') },
    { label: 'Le conteneur webbuild-web-1 tourne, port 8084 publié', run: c => c.running('webbuild-web-1') && c.published('webbuild-web-1', 8084, 80) },

});
})(typeof window !== 'undefined' ? window : globalThis);

<script>
/* main.js — démarrage : laboratoire, barre d'outils, dock, inspecteur, TP, fichiers, aide */
(function () {
'use strict';
const NS = window.NS; const { h, $, $$, clear, ui } = NS;
const LS = 'dockerlab.v1';
let lab = null, view = null, resPane = null, evPane = null, filesPane = null, currentTp = null, selName = null, loopT = null;
const terms = []; let activeTerm = -1; let termN = 0;
const S = { running: true, speed: 1 };

/* ------------------------------------------------ cycle de vie du laboratoire */
function mount(newLab, tp) {
  if (loopT) clearInterval(loopT);
  if (view) view.destroy(); ui.closeAllWindows();
  lab = newLab; currentTp = tp || null; selName = null; terms.length = 0; activeTerm = -1; termN = 0;
  clear($('#viewwrap')); clear($('#pane-term')); clear($('#pane-res')); clear($('#pane-events')); clear($('#pane-files'));
  view = NS.createView(lab, $('#viewwrap'), { select: n => { selName = n; renderInspector(); showRight('insp'); }, openBrowser: u => NS.openBrowser(lab, u) });
  resPane = NS.createResources(lab, $('#pane-res')); evPane = NS.createEvents(lab, $('#pane-events')); filesPane = NS.createFiles(lab, $('#pane-files'));
  buildTerminals(); lab.on(() => { renderInspector(); scheduleSave(); });
  renderInspector(); renderTp(); startLoop();
}
function freshLab(tp) {
  const l = new NS.Lab({ epoch: Date.UTC(2026, 9, 4, 7, 38, 0), seed: (Math.random() * 1e9) | 0 });
  if (tp && tp.build) tp.build(l);
  return l;
}
NS.installHostEditor(() => lab);

/* ------------------------------------------------ terminaux (onglets) */
function buildTerminals() {
  const wrap = h('div.termwrap'); const tabs = h('div.termtabs'); const body = h('div.termbody'); wrap.appendChild(tabs); wrap.appendChild(body); $('#pane-term').appendChild(wrap);
  function draw() {
    clear(tabs);
    terms.forEach((t, i) => tabs.appendChild(h('button.ttab' + (i === activeTerm ? '.on' : ''), { onclick: () => select(i) }, t.name, terms.length > 1 ? h('span.x', { title: 'Fermer ce terminal', onclick: e => { e.stopPropagation(); closeTerm(i); } }, '×') : null)));
    tabs.appendChild(h('button.small', { title: 'Ouvrir un nouveau terminal (utile pour « docker logs -f » pendant que vous tapez ailleurs)', onclick: () => add() }, '+ Terminal'));
    clear(body); if (terms[activeTerm]) { body.appendChild(terms[activeTerm].api.el); }
  }
  function select(i) { activeTerm = i; draw(); terms[i].api.focus(); }
  function add(initial) {
    const sess = initial || new NS.HostSession(lab); const t = { name: 'Terminal ' + (++termN), api: null };
    t.api = NS.Terminal(sess, { onIdle: () => { }, onRun: () => { } }); terms.push(t); activeTerm = terms.length - 1; draw(); t.api.focus(); return t;
  }
  function closeTerm(i) { const t = terms[i]; try { t.api.session.abort(); } catch (e) { } terms.splice(i, 1); activeTerm = Math.min(activeTerm, terms.length - 1); draw(); }
  buildTerminals.add = add;
  /* sessions déjà présentes (restauration) puis au moins une */
  lab.sessions.forEach(s => add(s)); if (!terms.length) add(); select(0);
  clear($('#palette')); NS.createCheat($('#palette'), () => terms[activeTerm] && terms[activeTerm].api);
}
const termApi = () => terms[activeTerm] && terms[activeTerm].api;

/* ------------------------------------------------ temps simulé (boucle d'horloge) */
function startLoop() {
  let last = performance.now();
  loopT = setInterval(() => {
    const now = performance.now(), dt = Math.min(now - last, 250); last = now;
    $('#simtime').textContent = 't = ' + fmtT(lab.clock.now);
    if (!S.running) return;
    const mult = S.speed * (lab.turbo > 0 ? 6 : 1);
    try { lab.clock.runFor(dt * mult); } catch (e) { console.error(e); }
  }, 50);
}
function fmtT(ms) { const s = Math.floor(ms / 1000); return s < 60 ? s + ' s' : Math.floor(s / 60) + ' min ' + (s % 60) + ' s'; }
const spd = $('#speed');
function setSpeed() { S.speed = Math.pow(100, spd.value / 100) / Math.pow(100, 0.3); const v = S.speed; $('#speedv').textContent = '×' + (v < 10 ? (Math.round(v * 10) / 10) : Math.round(v)); }
spd.addEventListener('input', setSpeed); setSpeed();
$('#btn-run').addEventListener('click', () => { S.running = !S.running; $('#btn-run').textContent = S.running ? '⏸ Pause' : '▶ Lecture'; $('#btn-run').classList.toggle('on', !S.running); });
$('#btn-t1').addEventListener('click', () => { lab.clock.runFor(60000); lab.changed(); ui.toast('Temps simulé avancé d\'une minute', 'info', 1500); });
$('#btn-why').addEventListener('click', () => NS.showWhy(lab));
$('#btn-browser').addEventListener('click', () => NS.openBrowser(lab));
$('#btn-fit').addEventListener('click', () => { $('#viewwrap').scrollTo(0, 0); view.refresh(); });

/* ------------------------------------------------ dock / volet droit */
function dockShow(tab) { $$('.dtab').forEach(b => b.classList.toggle('on', b.dataset.dock === tab)); ['term', 'res', 'files', 'events'].forEach(k => { $('#pane-' + k).style.display = k === tab ? '' : 'none'; }); $('#dock').classList.remove('min'); $('#dockmin').textContent = '▾'; if (tab === 'term' && termApi()) termApi().focus(); if (tab === 'files') filesPane.refresh(); }
$$('.dtab').forEach(b => b.addEventListener('click', () => dockShow(b.dataset.dock)));
$('#dockmin').addEventListener('click', () => { const d = $('#dock'); d.classList.toggle('min'); $('#dockmin').textContent = d.classList.contains('min') ? '▴' : '▾'; });
$('#dockmax').addEventListener('click', () => { const d = $('#dock'); d.classList.remove('min'); const big = d.dataset.big === '1'; d.style.height = big ? '' : Math.round(innerHeight * 0.72) + 'px'; d.dataset.big = big ? '0' : '1'; });
(function grip() { const gp = $('#dockgrip'), dock = $('#dock'); let y0 = null, h0 = 0; gp.addEventListener('mousedown', e => { y0 = e.clientY; h0 = dock.offsetHeight; e.preventDefault(); }); window.addEventListener('mousemove', e => { if (y0 === null) return; dock.style.height = Math.max(120, Math.min(innerHeight - 200, h0 + (y0 - e.clientY))) + 'px'; }); window.addEventListener('mouseup', () => { y0 = null; }); })();
$$('.rtab').forEach(b => b.addEventListener('click', () => { $$('.rtab').forEach(x => x.classList.toggle('on', x === b)); $('#inspector').style.display = b.dataset.r === 'insp' ? '' : 'none'; $('#tppane').style.display = b.dataset.r === 'tp' ? '' : 'none'; }));
const showRight = r => $$('.rtab').find(b => b.dataset.r === r).click();

      h('table.kv', h('tr', h('th', 'Conteneurs'), h('td', lab.containers.length + ' (' + run + ' en cours)')), h('tr', h('th', 'Images'), h('td', String(lab.images.length))), h('tr', h('th', 'Volumes'), h('td', String(lab.volumes.length))), h('tr', h('th', 'Réseaux'), h('td', String(lab.networks.length)))),

      ['Variables', c.config.env.filter(e => !/^(PATH|NGINX_VERSION|PKG_RELEASE|NJS|HOME|HOSTNAME|TERM)=/.test(e)).join('\n') || '—'], ['Montages', c.mounts.map(m => (m.type === 'bind' ? '📁 ' + m.source : '🗄 ' + m.name) + ' → ' + m.destination + (m.rw ? '' : ' (ro)')).join('\n') || '—']].map(([k, v]) => h('tr', h('th', k), h('td.mono', { style: { whiteSpace: 'pre-wrap', fontSize: '11.5px' } }, v)))),

/* ------------------------------------------------ sauvegarde */
let saveT = null;
function scheduleSave() { if (saveT) return; saveT = setTimeout(() => { saveT = null; autosave(); }, 4000); }
function snapshot() { return NS.snapshotLab(lab, { tp: currentTp ? currentTp.id : null }); }
function autosave() { try { if (lab.journal.length || currentTp) localStorage.setItem(LS, JSON.stringify(snapshot())); } catch (e) { } }
window.addEventListener('beforeunload', autosave);
function loadData(d, quiet) {
  try { const tp = SCbyId(d.tp); const l = NS.restoreLab(d, tp && tp.build ? tp.build : null); mount(l, tp); if (!quiet) ui.toast('Laboratoire chargé', 'ok'); }
  catch (e) { ui.toast('Fichier invalide : ' + e.message, 'err'); console.error(e); }
}
$('#btn-new').addEventListener('click', () => { const go = () => { mount(freshLab()); try { localStorage.removeItem(LS); } catch (e) { } }; if (lab.journal.length) ui.confirmBox('Nouveau laboratoire', 'Effacer tout (conteneurs, images, volumes, fichiers) ? Le laboratoire courant est sauvegardé dans ce navigateur, mais pas exporté.', go); else go(); });
let saveHandle = null;
async function saveAs(force) {
  const data = JSON.stringify(snapshot());
  if (window.showSaveFilePicker) {
    try { const handle = (!force && saveHandle) ? saveHandle : await window.showSaveFilePicker({ suggestedName: 'dockerlab.json', types: [{ description: 'Docker Lab (JSON)', accept: { 'application/json': ['.json'] } }] }); const w = await handle.createWritable(); await w.write(data); await w.close(); saveHandle = handle; ui.toast('Enregistré (' + handle.name + ')', 'ok'); return; } catch (e) { if (e && e.name === 'AbortError') return; }
  }
  const a = h('a', { href: URL.createObjectURL(new Blob([data], { type: 'application/json' })), download: 'dockerlab.json' }); document.body.appendChild(a); a.click(); a.remove(); ui.toast('Enregistré (dockerlab.json)', 'ok');
}
$('#btn-save').addEventListener('click', () => saveAs(false));
$('#btn-save').addEventListener('contextmenu', e => { e.preventDefault(); saveAs(true); });
$('#btn-open').addEventListener('click', () => $('#filein').click());
$('#filein').addEventListener('change', e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { try { loadData(JSON.parse(r.result)); } catch (x) { ui.toast('Fichier illisible', 'err'); } }; r.readAsText(f); e.target.value = ''; });

/* ------------------------------------------------ TP */
const SCbyId = id => (NS.SCENARIOS || []).find(s => s.id === id) || null;
const DIFF_LABEL = { 1: 'Facile', 2: 'Intermédiaire', 3: 'Avancé' };
const diffStars = n => '★'.repeat(n || 1) + '☆'.repeat(3 - (n || 1));
const diffText = n => diffStars(n) + ' ' + (DIFF_LABEL[n] || DIFF_LABEL[1]);
function startScenario(sc, force) {
  const go = () => { try { mount(freshLab(sc), sc); } catch (e) { ui.toast('Erreur de construction du TP : ' + e.message, 'err'); console.error(e); return; } showRight('tp'); autosave(); ui.toast('TP chargé : ' + sc.title, 'ok'); };

          st.see ? h('div.see', h('b', 'Vous devriez voir : '), h('span', { html: st.see })) : null,
          st.opts && st.opts.length ? h('details.opts', h('summary', 'Décryptage de la commande'), h('ul', st.opts.map(o => h('li', h('code', o[0]), ' : ', h('span', { html: o[1] }))))) : null);
      })));

}
function renderTp() {
  const box = $('#tppane'); clear(box); const sc = currentTp;
  if (!sc) { box.appendChild(h('div', h('h3', 'Aucun TP chargé'), h('p.muted', 'Utilisez « TP d\'exemple » en haut de l\'écran pour charger un sujet avec son cours, ses étapes expliquées, une correction et des vérifications automatiques.'))); return; }
  const res = h('div.tpres');
  const wide = h('button.small', { title: 'Élargir / réduire le volet', onclick: () => { const r = $('#right'); r.classList.toggle('wide'); try { localStorage.setItem('dockerlab.wide', r.classList.contains('wide') ? '1' : ''); } catch (e) { } } }, '↔ Élargir');
  box.appendChild(h('div.tp', h('h3', sc.title), h('span.lvl', sc.level + ' · ' + sc.duration + ' · ' + diffText(sc.diff)), ' ', wide, h('p', sc.desc),

    h('p.small.muted', '💡 Cliquez sur une commande du sujet pour l\'écrire dans le terminal (Maj+clic : l\'exécuter).'),
    h('div.btns', h('button.primary', { onclick: () => { res.textContent = 'Vérification en cours…'; setTimeout(() => runChecks(sc, res), 20); } }, '✔ Vérifier mon travail'),

      h('button', { onclick: () => ui.confirmBox('Recommencer', 'Repartir de l\'état de départ du TP ? Votre travail sera perdu.', () => startScenario(sc, true)) }, 'Recommencer')), res));

try { if (localStorage.getItem('dockerlab.wide')) $('#right').classList.add('wide'); } catch (e) { }
/* les commandes du sujet (balises <code>) s'insèrent dans le terminal d'un clic */
$('#tppane').addEventListener('click', e => {
  const c = e.target.closest && e.target.closest('code'); if (!c || !c.closest('.tp') || c.closest('.btns')) return;
  const t = c.textContent.trim(); if (!/^[a-z~./]/.test(t) || window.getSelection().toString()) return;
  const tm = termApi(); if (!tm) return; dockShow('term'); if (e.shiftKey) tm.runLines(t); else tm.insert(t);

function runChecks(sc, res) {

  res.insertBefore(h('p', { style: { fontWeight: 600, color: okN === sc.checks.length ? '#166534' : '#92400e' } }, okN + ' / ' + sc.checks.length + ' vérifications réussies'), res.firstChild);
}
$('#btn-scen').addEventListener('click', () => {
  const list = NS.SCENARIOS || []; const cats = []; list.forEach(sc => { const c = sc.cat || 'Docker'; if (!cats.includes(c)) cats.push(c); });

  function updateInfo() { const sc = SCbyId(tpSel.value); clear(info); if (sc) info.appendChild(h('p.muted', h('b', diffText(sc.diff) + ' · ' + sc.level + ' · ' + sc.duration), h('br'), sc.desc)); }
  catSel.addEventListener('change', fillTp); tpSel.addEventListener('change', updateInfo); fillTp();
  ui.modal('TP d\'exemple', [ui.field('Section', catSel), ui.field('Sujet', tpSel), info], [{ label: 'Annuler' }, { label: 'Charger', primary: true, fn: () => { const sc = SCbyId(tpSel.value); if (sc) startScenario(sc); } }]);
});

    { id: 'lim', label: 'Limites connues', render: () => h('div', { style: { maxWidth: '760px', padding: '8px 12px' } }, h('p', 'Docker Lab est un simulateur pédagogique : il ne lance aucun vrai programme. Ce qui est volontairement approché :'),
      h('ul', (NS.LIMITS || []).map(x => h('li', x)))) },
    { id: 'cov', label: 'Couverture du programme', render: () => h('div', { style: { padding: '8px 12px' } }, h('p.muted', cov.note),
      h('table.cov', h('tr', h('th', 'Thème'), h('th', 'État'), h('th', 'TP'), h('th', 'Remarque')), cov.rows.map(r => h('tr', h('td', r[0]), h('td', { class: ST[r[1]][1] }, ST[r[1]][0]), h('td', r[2]), h('td', r[3])))),

/* ------------------------------------------------ démarrage */
(function boot() {
  let saved = null; try { saved = JSON.parse(localStorage.getItem(LS) || 'null'); } catch (e) { }
  let ok = false;
  if (saved) { try { const tp = SCbyId(saved.tp); mount(NS.restoreLab(saved, tp && tp.build ? tp.build : null), tp); ok = true; } catch (e) { console.error(e); } }
  if (!ok) { mount(freshLab()); setTimeout(() => ui.toast('Bienvenue ! Essayez : docker run -d --name web -p 8080:80 nginx — ou chargez un TP.', 'info', 6000), 400); }
